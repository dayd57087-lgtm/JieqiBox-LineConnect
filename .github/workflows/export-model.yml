name: Export Detection Model

# Re-exports the upstream detector with dynamic input axes.
#
# Why: the published best.onnx has a hard-coded 640x640 input, so every inference
# costs the same no matter how small the board crop is. Exporting with dynamic
# axes lets the app run the same weights at 416 (or lower), which is roughly 2.4x
# less compute per frame — this is the main speed lever for line-connect.
#
# The result is published to the "line-connect-model" release, which the APK
# build prefers over the upstream weights. Re-run "Build Line Connect APK"
# afterwards to pick it up.

on:
  workflow_dispatch:
    inputs:
      source:
        description: 'Source .pt weights (URL or repo path)'
        required: false
        default: 'https://github.com/Velithia/JieqiModels/releases/download/yolo-models/best.pt'
      opset:
        description: 'ONNX opset'
        required: false
        default: '12'

permissions:
  contents: write

jobs:
  export:
    name: Export dynamic-shape ONNX
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ultralytics
        run: |
          python -m pip install --upgrade pip
          pip install ultralytics onnx onnxruntime

      - name: Fetch source weights
        run: |
          set -euo pipefail
          SRC="${{ inputs.source }}"
          case "$SRC" in
            http*) curl -L --fail -o model.pt "$SRC" ;;
            *)     cp "$SRC" model.pt ;;
          esac
          ls -lh model.pt

      - name: Export with dynamic axes
        env:
          OPSET: ${{ inputs.opset }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from ultralytics import YOLO

          model = YOLO("model.pt")
          path = model.export(
              format="onnx",
              imgsz=640,
              opset=int(os.environ["OPSET"]),
              simplify=True,
              dynamic=True,      # <- variable H/W so the app can run at 416
              half=False,
          )
          print("exported:", path)
          PY
          ls -lh model.onnx
          cp model.onnx best-dynamic.onnx

      - name: Verify dynamic shape and inference at several sizes
        run: |
          set -euo pipefail
          python - <<'PY'
          import numpy as np, onnx, onnxruntime as ort

          m = onnx.load("best-dynamic.onnx")
          inp = m.graph.input[0]
          dims = [d.dim_value or d.dim_param or "?" for d in inp.type.tensor_type.shape.dim]
          print("declared input:", inp.name, dims)
          if all(isinstance(d, int) and d > 0 for d in dims):
              raise SystemExit("model input is still static; dynamic export failed")

          sess = ort.InferenceSession("best-dynamic.onnx", providers=["CPUExecutionProvider"])
          i = sess.get_inputs()[0]
          o = sess.get_outputs()[0]
          print("runtime input :", i.name, i.shape)
          print("runtime output:", o.name, o.shape)

          for size in (320, 416, 640):
              dummy = np.zeros((1, 3, size, size), dtype=np.float32)
              out = sess.run([o.name], {i.name: dummy})[0]
              print(f"  {size}x{size} -> {out.shape}")
              # YOLO head: channels are 4 + num_classes (34 here)
              assert out.shape[1] == 38, f"unexpected channel count {out.shape[1]}"
          print("dynamic export verified")
          PY

      - name: Sanity check the static export too
        run: |
          set -euo pipefail
          # A fixed 640 model is kept as well: the app falls back to it if the
          # dynamic one ever fails to load.
          python - <<'PY'
          from ultralytics import YOLO
          YOLO("model.pt").export(format="onnx", imgsz=640, opset=12, simplify=True, dynamic=False)
          PY
          ls -lh model.onnx

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jieqibox-detector-onnx
          path: |
            best-dynamic.onnx
            model.onnx
          if-no-files-found: error
          retention-days: 90

      - name: Publish dynamic model
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="line-connect-model"
          # The asset MUST be called best.onnx: that is the name the APK build
          # downloads from this release.
          cp best-dynamic.onnx best.onnx
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" best.onnx \
            --title "JieqiBox 识别模型" \
            --notes "支持可变输入尺寸（320/416/640）。APK 构建优先使用该模型并以 416 运行以提升速度。重新运行 Build Line Connect APK 即可生效。" \
            --prerelease
          gh release view "$TAG" --json assets --jq '.assets[].name'
          echo "已发布。请重新运行 Build Line Connect APK。"
