name: Build Line Connect APK

# Builds an Android APK that adds the "连线自动走棋" (line connect auto play)
# feature on top of JieqiBox. Only the arm64-v8a ABI is built to keep the CI
# runtime short — that covers every reasonably modern phone.
#
# The resulting APK is attached to the fixed release tag "line-connect-latest"
# so the download URL never changes:
#   https://github.com/<owner>/<repo>/releases/download/line-connect-latest/jieqibox-line-connect.apk

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'package.json'
      - 'vite.config.ts'
      - '.github/workflows/build-line-connect.yml'

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK (arm64, YOLO)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          ndk: 26.1.10909125
          build-tools: '34.0.0'

      - name: Export NDK environment variables
        run: |
          NDK_PATH="${ANDROID_NDK_ROOT:-$ANDROID_NDK_LATEST_HOME}"
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> "$GITHUB_ENV"
          echo "NDK_HOME=$NDK_PATH"          >> "$GITHUB_ENV"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Resolve model (best.onnx)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/models

          # Prefer a model fine-tuned on the user's own screenshots
          # (produced by train-line-connect.yml), then a committed one, then
          # the upstream weights.
          if [ -s models/best.onnx ]; then
            echo "Using models/best.onnx committed to the repository"
            cp models/best.onnx public/models/best.onnx
          elif curl -L --fail -o public/models/best.onnx \
              "https://github.com/${{ github.repository }}/releases/download/line-connect-model/best.onnx"; then
            echo "Using the fine-tuned model from the line-connect-model release"
          else
            echo "Falling back to the upstream JieqiModels weights"
            curl -L --fail -o public/models/best.onnx \
              https://github.com/Velithia/JieqiModels/releases/download/yolo-models/best.onnx
          fi

          test -s public/models/best.onnx
          ls -l public/models/best.onnx

      - name: Install JS dependencies
        run: npm ci

      - name: Type check and build frontend
        run: npm run build

      - name: Build Tauri Android app (unsigned)
        run: npx tauri android build --apk --target aarch64
        env:
          CI: true
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Decode signing keystore
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sign"
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/sign/release.jks"
            echo "Using keystore from repository secret"
          else
            base64 -d .github/signing/release.jks.b64 > "$RUNNER_TEMP/sign/release.jks"
            echo "Using bundled self-signed keystore"
          fi

      - name: Align and sign APK
        id: sign
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/34.0.0"
          UNSIGNED=$(find src-tauri/gen/android/app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -z "$UNSIGNED" ]; then
            echo "::error::No APK produced"
            find src-tauri/gen/android/app/build/outputs -type f || true
            exit 1
          fi
          echo "Unsigned APK: $UNSIGNED"
          "$BT/zipalign" -f -p 4 "$UNSIGNED" "$RUNNER_TEMP/sign/aligned.apk"
          "$BT/apksigner" sign \
            --ks "$RUNNER_TEMP/sign/release.jks" \
            --ks-pass pass:android \
            --key-pass pass:android \
            --ks-key-alias hotrank \
            --out "$RUNNER_TEMP/sign/jieqibox-line-connect.apk" \
            "$RUNNER_TEMP/sign/aligned.apk"
          "$BT/apksigner" verify --print-certs "$RUNNER_TEMP/sign/jieqibox-line-connect.apk"
          ls -lh "$RUNNER_TEMP/sign/jieqibox-line-connect.apk"
          echo "apk=$RUNNER_TEMP/sign/jieqibox-line-connect.apk" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: jieqibox-line-connect-arm64
          path: ${{ steps.sign.outputs.apk }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK to the fixed release tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="line-connect-latest"
          gh release delete "$TAG" --yes --cleanup-tag || true
          cp "${{ steps.sign.outputs.apk }}" jieqibox-line-connect.apk
          gh release create "$TAG" jieqibox-line-connect.apk \
            --title "JieqiBox 连线自动走棋" \
            --notes "自动构建产物（arm64-v8a，包名 com.jieqibox.lineconnect）。与官方 JieqiBox 包名不同，可同时安装、互不影响。" \
            --prerelease
          echo "Download: https://github.com/${{ github.repository }}/releases/download/$TAG/jieqibox-line-connect.apk"
